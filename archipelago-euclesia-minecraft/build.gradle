plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// This script runs once per Minecraft version: Stonecutter makes a project per entry in
// settings.gradle (versions/<version>/), and stonecutter.current.version is that project's version.
def minecraftVersion = stonecutter.current.version

// Fabric convention: pair the mod's feature version with the target Minecraft version, so each
// version's jar is distinct (1.0.0+26.1.2, 1.0.0+26.2, …) without touching mod_version.
// gradle.properties is the source of truth; the release tag mirrors this.
version = "${project.mod_version}+${minecraftVersion}"
group = project.maven_group
// Every version project is named after its Minecraft version; the jar is still aem-<version>.jar.
base.archivesName = rootProject.name

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"aem" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// One run/ for every version, where it has always been (saves, logs, the dump output), rather
	// than one per versions/<version>/. Loom resolves runDir against the version project, so it has
	// to be relative ("../../run"): an absolute path gets glued on after versions/<version>/.
	runConfigs.configureEach {
		runDir = project.relativePath(rootProject.file("run"))
		// Mojang's 26.3 launcher profile passes this and Loom doesn't copy it: without it, about half of
		// 26.3 launches die at startup with a bare 0xC0000005 and no crash report (SDL's native code
		// running out of stack on a Java thread). Harmless on the versions that don't ask for it.
		vmArg "-XX:StackShadowPages=32"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${minecraftVersion}"
	
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// WebSocket client with permessage-deflate support, bundled into the mod jar (jar-in-jar).
	// slf4j is excluded from the dev classpath because Minecraft already provides it at runtime.
	implementation("org.java-websocket:Java-WebSocket:${project.java_websocket_version}") {
		exclude group: "org.slf4j"
	}
	include "org.java-websocket:Java-WebSocket:${project.java_websocket_version}"
}

processResources {
	def version = project.version
	def mcCompat = project.mc_compat
	inputs.property "version", version
	inputs.property "mcCompat", mcCompat

	filesMatching("fabric.mod.json") {
		expand "version": version, "mc_compat": mcCompat
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = base.archivesName.get()
	inputs.property "projectName", projectName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
