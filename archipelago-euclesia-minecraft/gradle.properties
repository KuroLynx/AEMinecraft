# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# The Minecraft version is each Stonecutter project's own (settings.gradle); what differs per version
# (Fabric API, the fabric.mod.json range) lives in versions/<version>/gradle.properties.
loader_version=0.19.3
loom_version=1.16-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=fr.euclesia.mcarchipelago

# Dependencies
java_websocket_version=1.6.0

# Groovy build scripts are deliberate (the repo's own); silences Stonecutter's Kotlin-DSL advice.
dev.kikugie.stonecutter.hard_mode=true
