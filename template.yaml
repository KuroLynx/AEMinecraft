name: Player{number}
description: Minecraft [AEM] — Minecraft Randomizer by KuroLynx (mod by EDGN)
game: Minecraft [AEM]
requires:
  version: 0.6.7

Minecraft [AEM]:
  # -------------------------------------------------------------------------
  # Generic Archipelago options
  # -------------------------------------------------------------------------

  progression_balancing:
    # A system that moves progression items earlier to prevent the player
    # from getting stuck. Higher = less likely to get stuck early.
    # Minimum: 0 (disabled), Maximum: 99 (extreme)
    normal: 50
    random: 0
    random-low: 0
    random-high: 0

  accessibility:
    # Set rules for reachability of items and locations.
    # full:    every location must be reachable and every item acquirable.
    # minimal: only what is needed to reach the goal must be reachable.
    # items:   every progression item is acquirable, but some locations may stay unreachable.
    full: 50
    minimal: 0
    items: 0

  # -------------------------------------------------------------------------
  # Boss Goal
  # -------------------------------------------------------------------------

  boss_list:
    # The bosses you must defeat to complete your game. You must defeat every boss listed.
    # Use the special value "All" to require every boss.
    #
    # Valid values: All, Ender Dragon, Elder Guardian, Warden, Wither
    #
    # Example — require every boss:
    #   - All
    #
    # Example — require only the Ender Dragon:
    #   - Ender Dragon
    - All

  # -------------------------------------------------------------------------
  # Start Dimension
  # -------------------------------------------------------------------------

  start_dimension:
    # The dimension you spawn in.
    #   overworld: classic start. The Nether and The End each need their Dimension Unlock item.
    #   nether:    spawn in the Nether (no Nether unlock item is added). Reaching the Overworld
    #              then needs the "Dimension Unlock: Overworld" item, a Nether ruined portal, and
    #              Knowledge: Pyromaniac to light it. The End is still reached from the Overworld.
    # The End cannot be a start dimension (no resources to gear up — not completable).
    overworld: 50
    nether: 0

  # -------------------------------------------------------------------------
  # Advancements
  # -------------------------------------------------------------------------

  advancements_required:
    # Number of advancements you must complete as an additional victory condition.
    # Set to 0 to disable this condition entirely.
    # Minimum: 0, Maximum: 1153 (every advancement across vanilla + BACAP; this ceiling comes from
    # the bundled manifests, so it shifts with the supported game/datapack version).
    # The requirement is automatically clamped to the advancements that actually exist this seed:
    # 100 for vanilla with challenge_sanity off, 125 with it on, and up to ~1028 more with BACAP.
    #
    # Note: this is cumulative with the boss kill condition.
    125: 50
    random: 0
    random-range-0-1153: 0

  # -------------------------------------------------------------------------
  # Kill Sanity
  # -------------------------------------------------------------------------

  kill_sanity:
    # If enabled, killing a mob for the first time sends a location check.
    # Bosses always send a check regardless of this setting.
    'false': 0
    'true': 50

  # -------------------------------------------------------------------------
  # Villager Trust
  # -------------------------------------------------------------------------

  villager_trust:
    # If enabled, trading with villagers requires receiving
    # "Progressive Villager Trust" items (one per trade level, 5 total).
    # These items are added to the item pool.
    'false': 0
    'true': 50

  # -------------------------------------------------------------------------
  # Mob Spawn Lock
  # -------------------------------------------------------------------------

  mob_spawn_lock_category:
    # Define which mob categories are locked until their
    # "Entity Unlock: <mob>" item is received from the multiworld.
    # Leave empty to disable mob spawn locking entirely.
    #
    # Valid values: passive, neutral, hostile, boss
    # You can combine multiple categories.
    #
    # Locking "boss" gates the bosses (Ender Dragon, Elder Guardian, Warden, Wither) behind their
    # "Entity Unlock: <boss>" item: they cannot spawn — so their kill check and any goal that needs
    # them stays out of logic — until that item is received. (A monument that generates while Elder
    # Guardian is locked stays without its elder guardians; monument mobs are not retro-spawned.)
    #
    # Example — lock only hostiles:
    #   - hostile
    #
    # Example — lock everything including bosses:
    #   - passive
    #   - neutral
    #   - hostile
    #   - boss
    []

  # -------------------------------------------------------------------------
  # Structure Unlock
  # -------------------------------------------------------------------------

  structure_unlock:
    # Define which structures are locked until their
    # "Structure Unlock: <structure>" item is received from the multiworld.
    # Structures that are not locked are available as soon as their dimension is reachable.
    # Leave empty to disable structure locking entirely.
    #
    # Accepts dimension presets, the special value "All", and/or individual structure names
    # (you can mix them freely):
    #   - Dimension presets: "Overworld", "Nether", "The End"
    #   - "All" — lock every structure
    #   - Any structure name, e.g. "Ancient City", "Village (Plains)", "Nether Fortress"
    #
    # Example — lock all Nether structures plus the Ancient City:
    #   - Nether
    #   - Ancient City
    #
    # Example — lock everything:
    #   - All
    []

  # -------------------------------------------------------------------------
  # Traps
  # -------------------------------------------------------------------------

  trap_chance:
    # The probability (%) for each filler item to be replaced with a trap.
    # Set to 0 to disable traps entirely.
    # Trap types and their frequency are weighted by their count in the item pool.
    #
    # Minimum value is 0
    # Maximum value is 100
    30: 50
    0: 0
    random: 0
    random-low: 0
    random-range-0-30: 0

  # -------------------------------------------------------------------------
  # Death Link
  # -------------------------------------------------------------------------

  death_link:
    # When you die, all players with Death Link enabled die too.
    # When any of them dies, you die too.
    'false': 0
    'true': 50

  # -------------------------------------------------------------------------
  # Challenge Sanity
  # -------------------------------------------------------------------------
  challenge_sanity:
    # If enabled, includes every "challenge" advancement (the spiky-border ones) in the location
    # pool. That is 25 advancements in vanilla, e.g.:
    #   - A Furious Cocktail (have all potion effects simultaneously)
    #   - How Did We Get Here? (have all status effects simultaneously)
    #   - Arbalistic (kill 5 unique mobs with one arrow)
    #   - A Balanced Diet (eat every food item)
    # These advancements are very difficult to complete and are excluded by default.
    # With BACAP enabled, this also includes BACAP's 218 challenge advancements (scattered across
    # most tabs, not just its "Super Challenges" tab).
    'false': 50
    'true': 0

  # -------------------------------------------------------------------------
  # Finders
  # -------------------------------------------------------------------------
  structure_finder:
    # How the Progressive Structure Finder (5 copies; each reveals more nearby structures) is handled.
    #   in_pool  - the 5 copies are shuffled into the multiworld item pool to be found.
    #   start    - you begin with all 5 copies (full reveal from the start); none in the pool.
    #   disabled - the Structure Finder is removed entirely.
    in_pool: 50
    start: 0
    disabled: 0

  biome_finder:
    # How the Biome Finder (a soulbound compass that points to a searched biome) is handled.
    #   in_pool  - the compass is shuffled into the multiworld item pool to be found.
    #   start    - you begin with the compass; it is not in the pool.
    #   disabled - the Biome Finder is removed entirely.
    in_pool: 50
    start: 0
    disabled: 0

  # -------------------------------------------------------------------------
  # BlazeandCave's Advancements Pack (BACAP)
  # -------------------------------------------------------------------------
  blazeandcave:
    # Add BlazeandCave's Advancements Pack (BACAP) to the location pool. When enabled, ~1028 BACAP
    # custom advancements become checks alongside the (BACAP-rewritten) vanilla ones — BACAP's
    # minecraft: files rewrite the vanilla advancements in place and reuse their locations, so the
    # vanilla checks are not replaced. The hidden "statistics" (auto-granted stat counters) and
    # "technical" (datapack plumbing) tabs are not real checks and are excluded; BACAP's 218
    # challenge advancements are only included when challenge_sanity is on.
    # You MUST have the BlazeandCave's Advancements Pack datapack installed in your world for
    # these checks to fire. Their logic is derived automatically from each advancement's criteria
    # and parent — the same way the vanilla advancements are.
    'false': 50
    'true': 0

  # -------------------------------------------------------------------------
  # Standard item/location options
  # -------------------------------------------------------------------------

  local_items: [ ]
  non_local_items: [ ]
  start_inventory: { }
  start_hints: [ ]
  start_location_hints: [ ]
  exclude_locations: [ ]
  priority_locations: [ ]
  item_links: [ ]