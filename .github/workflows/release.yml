name: Release

# The apworld dictates the version. minecraft_aem/archipelago.json's "world_version" is the single
# source of truth: it is built into the mod as mod_version and is already carried by the apworld, and
# the two ship together as one GitHub Release vX.Y.Z. Every push to master reads that version and
# publishes it ONLY if a release for it does not already exist — so bumping world_version is the whole
# release signal, and re-pushing after a failed build simply retries (the release still doesn't
# exist). Run the workflow manually (workflow_dispatch) to build both artifacts without publishing,
# or give it a `prerelease` suffix to publish a GitHub pre-release from any branch:
#   gh workflow run release.yml --ref release/v0.7.0 -f prerelease=rc.1   ->  v0.7.0-rc.1
# The suffix goes on the tag and the jar names only; world_version stays X.Y.Z, so the final v0.7.0
# still publishes from master as usual.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Pre-release suffix (e.g. rc.1) to publish vX.Y.Z-<suffix>; empty = dry run"
        required: false
        default: ""

# Least privilege: the job only needs to create the GitHub Release.
permissions:
  contents: write

# Serialize release runs so two quick pushes can't race to create the same tag; let an in-flight
# publish finish rather than cancelling it.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }} # consumed by the gh CLI in the resolve and publish steps
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and decide whether to release
        id: resolve
        env:
          PRERELEASE: ${{ github.event.inputs.prerelease }} # via env to keep it out of the shell command line
        run: |
          set -euo pipefail

          # world_version is authoritative; jq -e fails the step if it is missing or null.
          version="$(jq -er '.world_version' minecraft_aem/archipelago.json)"
          # One mod jar per Minecraft version: the Stonecutter version list in settings.gradle.
          mc="$(sed -nE "s/^[[:space:]]*versions[[:space:]]+(.*)$/\1/p" archipelago-euclesia-minecraft/settings.gradle | tr -d "'\"," | xargs)"
          [ -n "${mc}" ] || { echo "no Minecraft versions found in settings.gradle" >&2; exit 1; }

          prerelease=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "${PRERELEASE:-}" ]; then
            [[ "${PRERELEASE}" =~ ^[0-9A-Za-z.]+$ ]] || { echo "bad prerelease suffix: ${PRERELEASE}" >&2; exit 1; }
            version="${version}-${PRERELEASE}"
            if gh release view "v${version}" >/dev/null 2>&1; then
              echo "v${version} already exists; pick another suffix." >&2
              exit 1
            fi
            echo "Pre-release: building and publishing v${version}."
            build=true
            publish=true
            prerelease=true
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Dry run: building v${version} without publishing."
            build=true
            publish=false
          elif gh release view "v${version}" >/dev/null 2>&1; then
            echo "v${version} is already released; nothing to do."
            build=false
            publish=false
          else
            echo "v${version} not yet released; building and publishing."
            build=true
            publish=true
          fi

          {
            echo "version=${version}"
            echo "mc=${mc}"
            echo "build=${build}"
            echo "publish=${publish}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        if: steps.resolve.outputs.build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        if: steps.resolve.outputs.build == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        if: steps.resolve.outputs.build == 'true'
        working-directory: archipelago-euclesia-minecraft
        env:
          VERSION: ${{ steps.resolve.outputs.version }} # via env to keep it out of the shell command line
        run: ./gradlew --no-daemon build -Pmod_version="${VERSION}"

      - name: Package apworld
        if: steps.resolve.outputs.build == 'true'
        run: |
          set -euo pipefail
          # world_version already lives in archipelago.json (the source of truth), so the apworld is
          # packaged as-is — no stamping. __pycache__ and *.pyc are excluded.
          python - <<'PY'
          import os, zipfile
          with zipfile.ZipFile("minecraft_aem.apworld", "w", zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk("minecraft_aem"):
                  dirs[:] = [d for d in dirs if d != "__pycache__"]
                  for f in files:
                      if f.endswith(".pyc"):
                          continue
                      full = os.path.join(root, f)
                      z.write(full, full.replace(os.sep, "/"))
          print("packaged minecraft_aem.apworld")
          PY

      - name: Stage assets
        if: steps.resolve.outputs.build == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          MC: ${{ steps.resolve.outputs.mc }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # `build` ran in every Stonecutter version project; each left its jar in versions/<mc>/build/libs.
          for mc in ${MC}; do
            cp "archipelago-euclesia-minecraft/versions/${mc}/build/libs/aem-${VERSION}+${mc}.jar" "dist/aem-${VERSION}+${mc}.jar"
          done
          # NOT versioned in the filename. Archipelago derives the Python module name from the
          # apworld's filename stem (worlds/__init__.py: world_name = Path(path).stem, then
          # zipimporter.find_spec(f"worlds.{world_name}")), so the stem MUST equal the package
          # inside the zip. Shipping minecraft_aem-0.4.0.apworld made it look for
          # worlds.minecraft_aem-0.4.0 — which is neither a valid module name nor present — and the
          # world silently "failed to initialize", surfacing to players as
          # "No functional world found to handle game AEMinecraft".
          # The version is already inside, in archipelago.json's world_version, which is what AP
          # reads and displays.
          cp minecraft_aem.apworld "dist/minecraft_aem.apworld"
          # The player YAML template lives in the repo and is kept current; ship it alongside the build.
          cp template.yaml "dist/minecraft_aem-${VERSION}.yaml"
          ls -l dist

      - name: Upload build artifacts
        if: steps.resolve.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aem-${{ steps.resolve.outputs.version }}
          path: dist/*

      - name: Publish release
        if: steps.resolve.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          TARGET_SHA: ${{ github.sha }} # the commit built (master, or the pre-release's branch); tag points here
          PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          # A pre-release never becomes "Latest", so players on the stable release aren't offered it.
          if [ "${PRERELEASE}" = "true" ]; then kind=(--prerelease --latest=false); else kind=(--latest); fi
          # Hand-written notes when docs/release-notes/v<version>.md exists, else GitHub's generated list.
          notes_file="docs/release-notes/v${VERSION}.md"
          if [ -f "${notes_file}" ]; then notes=(--notes-file "${notes_file}"); else notes=(--generate-notes); fi
          gh release create "v${VERSION}" dist/* \
            --target "${TARGET_SHA}" \
            --title "v${VERSION}" \
            "${kind[@]}" \
            "${notes[@]}"
