name: Release mod

# Releases the Fabric mod only. gradle.properties is the source of truth for the version
# (mod_version + minecraft_version, e.g. 1.0.0+26.1.2); the tag must mirror it. To cut a
# release: bump mod_version and/or minecraft_version in gradle.properties, commit, then push a
# tag `mod-v<mod_version>+<minecraft_version>` (e.g. mod-v1.0.0+26.1.3). A Minecraft-only bump
# therefore ships without touching the apworld. `workflow_dispatch` builds without releasing.
on:
  push:
    tags:
      - "mod-v*"
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve & check version
        id: ver
        working-directory: archipelago-euclesia-minecraft
        run: |
          mod_version=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          mc_version=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          expected="${mod_version}+${mc_version}"
          echo "version=${expected}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#mod-v}"
            if [ "${tag_version}" != "${expected}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match gradle.properties (expected mod-v${expected}). Bump mod_version/minecraft_version or fix the tag."
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Mod release version: ${expected}"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        working-directory: archipelago-euclesia-minecraft
        run: ./gradlew --no-daemon build

      - name: Stage jar
        run: |
          mkdir -p dist
          cp "archipelago-euclesia-minecraft/build/libs/aem-${{ steps.ver.outputs.version }}.jar" dist/
          ls -l dist

      - name: Upload build artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: aem-mod-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Publish GitHub Release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/aem-${{ steps.ver.outputs.version }}.jar
