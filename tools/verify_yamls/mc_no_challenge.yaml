# A full fill with challenge_sanity OFF — the axis the other three verify yamls never test.
#
# mc_overworld, mc_nether and mc_bacap all set challenge_sanity: 'true', and verify_all_options runs at
# maximum restriction, which also turns it on. That agreement left the DEFAULT configuration unverified,
# and it is where 'Hero of the Village' stopped being a location while three villager-gift routes still
# named it — an intermittent KeyError mid-fill, 2 generations in 6.
#
# Every lock is on so the fill is under real pressure; only the sanity option is off, which is what
# removes locations from the seed.
name: MCNoChallenge
description: Verify a fill with challenge_sanity off, where challenge-frame locations do not exist
game: AEMinecraft
requires:
  version: 0.6.7

AEMinecraft:
  progression_balancing: 0
  accessibility: full
  boss_list:
    - All
  start_dimension:
    overworld: 100
    nether: 0
  advancements_required:
    125: 100
  kill_sanity: 'true'
  villager_trust: 'true'
  mob_spawn_lock:
    - passive
    - neutral
    - hostile
  structure_unlock: []
  trap_chance: 0
  death_link: 'false'
  challenge_sanity: 'false'
  knowledge_gates:
    - All
  glitch_logic: 'true'
